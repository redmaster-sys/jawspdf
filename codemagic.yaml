workflows:
  jawspdf-appstore-ipa:
    name: JawsPDF iOS App Store IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.jawspdf.studio"
    scripts:
      - name: XcodeGen ile Xcode Projesi Üret
        script: |
          cd ios-app
          brew install xcodegen
          xcodegen generate
      - name: iOS IPA Derle
        script: |
          cd ios-app
          xcodebuild clean archive \
            -project JawsPDF.xcodeproj \
            -scheme JawsPDF \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/JawsPDF.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p $CM_BUILD_DIR/Payload
          cp -R $CM_BUILD_DIR/JawsPDF.xcarchive/Products/Applications/JawsPDF.app $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR
          zip -r9 JawsPDF-v1.0.0.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/*.ipa
      - $CM_BUILD_DIR/*.xcarchive
